name: smartpos_frontend
description: SmartPOS Frontend Application for managing shop inventory and transactions
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # HTTP and networking
  http: ^1.1.0
  dio: ^5.4.0
  
  # State management
  provider: ^6.1.1
  
  # Storage
  shared_preferences: ^2.2.2
  
  # UI components
  cupertino_icons: ^1.0.6
  flutter_spinkit: ^5.2.0
  
  # Barcode scanning
  mobile_scanner: ^3.5.5
  
  # Utils
  intl: ^0.20.2
  
  # QR code
  qr_flutter: ^4.1.0
  
  # Image picker
  image_picker: ^1.0.7
  
  # HTTP multipart for file upload
  http_parser: ^4.0.2
  
  # Charts
  fl_chart: ^0.65.0
  
  # SVG support
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true
  generate: true # For localization

  assets:
    - assets/images/
